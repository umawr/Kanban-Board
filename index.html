<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Track Board</title>
  </head>

  <body>
    <div class="center">
      <div class="lists">
        <div class="to-do">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_10
            </span>
            <p class="heading">To do</p>
            <p class="number numberToDo">#0</p>
          </div>
          <button class="add-button-to-do add-button">+ Add task</button>
        </div>
        <div class="in-progress">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_40
            </span>
            <p class="heading">In progress</p>
            <p class="number numberInProgress">#0</p>
          </div>
          <button class="add-button-in-progress add-button">+ Add task</button>
        </div>
        <div class="completed">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_90
            </span>
            <p class="heading">Completed</p>
            <p class="number numberCompleted">#0</p>
          </div>
          <button class="add-button-completed add-button">+ Add task</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
