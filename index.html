<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Kanban Board</title>
  </head>

  <body>
    <div class="center">
      <div class="lists">
        <div class="to-do">
          <p class="heading">To do</p>
          <div class="task">take out the trash</div>
          <div class="task">buy groceries</div>
          <div class="task">complete odyssey</div>
          <div class="task">magnets</div>
        </div>
        <div class="in-progress">
          <p class="heading">In progress</p>
          <div class="task">wash car</div>
          <div class="task">arrange books</div>
          <div class="task">nothing</div>
          <div class="task">refill station</div>
          <div class="task">printer shop</div>
          <div class="task">eight</div>
        </div>
        <div class="completed">
          <p class="heading">Completed</p>
          <div class="task">book tickets</div>
          <div class="task">update repository</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
