<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Nazar</title>
  </head>

  <body>
    <div class="center">
      <button class="toggle-button">
        <span class="material-symbols-outlined icon">invert_colors</span>
      </button>
      <button class="ratio-button">
        <span class="material-symbols-outlined icon">width_normal</span>
      </button>
      <div class="lists">
        <div class="to-do">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_10
            </span>
            <p class="heading">To do</p>
            <p class="number numberToDo"></p>
          </div>
          <button class="add-button-to-do add-button">
            <span class="material-symbols-outlined icon">add_2</span>
          </button>
        </div>
        <div class="in-progress">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_40
            </span>
            <p class="heading">In progress</p>
            <p class="number numberInProgress"></p>
          </div>
          <button class="add-button-in-progress add-button">
            <span class="material-symbols-outlined icon">add_2</span>
          </button>
        </div>
        <div class="completed">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_90
            </span>
            <p class="heading">Completed</p>
            <p class="number numberCompleted"></p>
          </div>
          <button class="add-button-completed add-button">
            <span class="material-symbols-outlined icon">add_2</span>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
