<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>Kanban Board</title>
  </head>

  <body>
    <div class="center">
      <div class="lists">
        <div class="to-do">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_10
            </span>
            <p class="heading">To do</p>
            <p class="number">#1</p>
          </div>
          <div class="task">
            <div class="up-bar">
              <p class="task-number">1.</p>
              <button class="trash-button">
                <span class="material-symbols-outlined icon">delete</span>
              </button>
            </div>
            <p class="text">
              Documents to update aadhar and college board
            </p>
            <div class="activity-bar">
              <button class="flag-button">
                <span class="material-symbols-outlined icon">flag</span>
              </button>
              <div class="time-bar">
                <span class="material-symbols-outlined icon">alarm</span>
                <p class="time">in 3 days</p>
              </div>
            </div>
          </div>
          <button class="add-button">+ Add task</button>
        </div>
        <div class="in-progress">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_40
            </span>
            <p class="heading">In progress</p>
            <p class="number">#1</p>
          </div>
          <div class="task">
            <div class="up-bar">
              <p class="task-number">1.</p>
              <button class="trash-button">
                <span class="material-symbols-outlined icon">delete</span>
              </button>
            </div>
            <p class="text">
              Buy milk
            </p>
            <div class="activity-bar">
              <button class="flag-button">
                <span class="material-symbols-outlined icon">flag</span>
              </button>
              <div class="time-bar">
                <span class="material-symbols-outlined icon">alarm</span>
                <p class="time">in 3 days</p>
              </div>
            </div>
          </div>
          <button class="add-button">+ Add task</button>
        </div>
        <div class="completed">
          <div class="heading-container">
            <span class="material-symbols-outlined icon">
              clock_loader_90
            </span>
            <p class="heading">Completed</p>
            <p class="number">#1</p>
          </div>
          <div class="task">
            <div class="up-bar">
              <p class="task-number">1.</p>
              <button class="trash-button">
                <span class="material-symbols-outlined icon">delete</span>
              </button>
            </div>
            <p class="text">Tickets to Dune 3</p>
            <div class="activity-bar">
              <button class="flag-button">
                <span class="material-symbols-outlined icon">flag</span>
              </button>
              <div class="time-bar">
                <span class="material-symbols-outlined icon">alarm</span>
                <p class="time">in 3 days</p>
              </div>
            </div>
          </div>
          <button class="add-button">+ Add task</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
